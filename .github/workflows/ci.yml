name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: 单元测试
        run: ./gradlew :build-logic:convention:test testDebugUnitTest testGithubDebugUnitTest

      - name: Lint
        run: ./gradlew lintGithubDebug :core:updater:lintDebug :core:designsystem:lintDebug

      - name: 打包 debug
        run: ./gradlew assembleGithubDebug

      - name: 上传 debug 包
        uses: actions/upload-artifact@v7
        with:
          name: SynoPilot-debug-${{ github.sha }}
          path: app/build/outputs/apk/github/debug/*.apk
          retention-days: 14

      - name: 上传测试和 Lint 报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
