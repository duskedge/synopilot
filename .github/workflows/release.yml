name: Release

# 推送 v* 标签时发布，例如：
#   git tag -a v0.1.0 -m "- 第一个版本" && git push origin v0.1.0
# 带 -beta.N / -rc.N 的标签发布为预发布，只推送给打开了「接收测试版」的用户。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要读取标签说明和上一个标签

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: 检查标签格式
        run: ./gradlew -q :app:printVersionCode -PversionTag="$GITHUB_REF_NAME"

      - name: 还原签名文件
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret：SIGNING_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: 打包
        env:
          VERSION_TAG: ${{ github.ref_name }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleGithubRelease

      - name: 整理安装包并校验签名
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/github/release/app-github-release.apk "dist/SynoPilot-${VERSION}.apk"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "dist/SynoPilot-${VERSION}.apk" | head -3

      - name: 更新说明
        run: |
          # 优先使用附注标签的说明（git tag -a v1.2.0 -m "..."）；
          # 轻量标签或说明为空时，列出上一个标签以来的提交标题。
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          fi
          if [ ! -s notes.md ] || ! grep -q '[^[:space:]]' notes.md; then
            PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            git log --no-merges --pretty='- %s' "${PREV:+$PREV..}$GITHUB_REF_NAME" > notes.md
          fi
          cat notes.md

      - name: 生成 update.json
        run: |
          scripts/make-update-json.sh "$GITHUB_REF_NAME" "dist/SynoPilot-${GITHUB_REF_NAME#v}.apk" notes.md > dist/update.json
          cat dist/update.json

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* $PRE \
            --verify-tag \
            --title "SynoPilot ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
